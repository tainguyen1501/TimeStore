{{- if not .Values.rootCredentials.existingSecret }}
{{- $name := include "timestore.rootSecretName" . }}
{{- $secret := .Values.rootCredentials.secretKey }}
{{- if not $secret }}
{{- /* Keep a generated secret across upgrades: reuse the one already in the cluster. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $secret = index $existing.data .Values.rootCredentials.secretKeyKey | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- if or (lt (len $secret) 8) (gt (len $secret) 128) }}
{{- fail "rootCredentials.secretKey must be 8–128 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "timestore.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.rootCredentials.accessKeyKey }}: {{ required "rootCredentials.accessKey is required" .Values.rootCredentials.accessKey | b64enc | quote }}
  {{ .Values.rootCredentials.secretKeyKey }}: {{ $secret | b64enc | quote }}
{{- end }}
{{- if not .Values.masterKey.existingSecret }}
{{- $key := trim (required "masterKey.value or masterKey.existingSecret is required: TimeStore never creates a master key (openssl rand -base64 32)" .Values.masterKey.value) }}
{{- if or (ne (len $key) 44) (not (hasSuffix "=" $key)) }}
{{- fail "masterKey.value must be 32 bytes as Base64 (44 characters, created with: openssl rand -base64 32)" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "timestore.masterKeySecretName" . }}
  labels:
    {{- include "timestore.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.masterKey.key }}: {{ $key | b64enc | quote }}
{{- end }}
