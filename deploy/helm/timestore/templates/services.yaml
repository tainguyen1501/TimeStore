apiVersion: v1
kind: Service
metadata:
  name: {{ include "timestore.fullname" . }}-s3
  labels:
    {{- include "timestore.labels" . | nindent 4 }}
  {{- with .Values.service.s3.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.s3.type }}
  selector:
    {{- include "timestore.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.s3.port }}
      targetPort: s3
      {{- if and .Values.service.s3.nodePort (ne .Values.service.s3.type "ClusterIP") }}
      nodePort: {{ .Values.service.s3.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "timestore.fullname" . }}-admin
  labels:
    {{- include "timestore.labels" . | nindent 4 }}
  {{- with .Values.service.admin.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.admin.type }}
  selector:
    {{- include "timestore.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.service.admin.port }}
      targetPort: admin
---
# Governing service of the StatefulSet (stable pod DNS name).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "timestore.fullname" . }}-headless
  labels:
    {{- include "timestore.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "timestore.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
