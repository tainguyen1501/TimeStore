{{- with .Values.ingress.admin }}
{{- if .enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "timestore.fullname" $ }}-admin
  labels:
    {{- include "timestore.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .tlsSecret }}
  tls:
    - hosts:
        - {{ .host | quote }}
      secretName: {{ .tlsSecret }}
  {{- end }}
  rules:
    - host: {{ required "ingress.admin.host is required" .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "timestore.fullname" $ }}-admin
                port:
                  name: admin
{{- end }}
{{- end }}
