# TimeStore Helm chart. TimeStore runs as one pod (single node: SQLite metadata with one writer, blobs on the pod's
# volume). Settings not listed here go through `extraEnv` as TimeStore__Section__Key variables (docs/configuration.md).

image:
  repository: ghcr.io/tainguyen1501/timestore
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The root (break-glass) key pair: signs S3 requests and signs in to the admin UI.
rootCredentials:
  # A Secret you manage, with the keys named below. When set, accessKey and secretKey are ignored.
  existingSecret: ""
  accessKeyKey: accessKey
  secretKeyKey: secretKey
  # Used when existingSecret is empty. Leave secretKey empty to have one generated (32 characters) and kept across
  # upgrades; read it with the command printed after install. A reinstall after `helm uninstall` generates a new one
  # (the data and other access keys stay): use existingSecret for a root key pair that never changes.
  accessKey: admin
  secretKey: ""

# Required. The 32-byte key that encrypts stored access-key secrets (not objects); TimeStore never creates one. Create
# it once and keep a copy apart from the cluster: without it every access key must be created again (docs/backup.md).
#   openssl rand -base64 32
masterKey:
  # A Secret you manage, holding the key under `key` (Base64, or the 32 raw bytes of an earlier master.key):
  #   kubectl create secret generic timestore-master-key --from-literal=master.key="$(openssl rand -base64 32)"
  existingSecret: ""
  key: master.key
  # Used when existingSecret is empty: the key as Base64; the chart keeps it in a Secret of its own. From TimeOps:
  # ${{ secrets.TIMESTORE_MASTER_KEY }} (a workspace secret, never in Git).
  value: ""

config:
  # S3:Region: the region clients sign with.
  region: us-east-1
  # S3:PublicUrl: how clients outside reach the S3 port, for the URLs and share links the admin UI shows. Empty: taken
  # from ingress.s3 when it is enabled.
  publicUrl: ""
  # S3:Domains: domains for virtual-host addressing (bucket.<domain>).
  domains: []
  # Admin:SecureCookies: mark the session cookie Secure. Empty (null): true when ingress.admin has TLS.
  secureCookies: null
  # Admin:SessionHours: lifetime of an admin sign-in (1–720).
  sessionHours: 24

# Built-in backups of the running server (docs/backup.md), with a key of role "backup" through the admin port:
#   kubectl port-forward svc/<release>-timestore-admin 9001
#   POST /api/v1/backups writes an archive to /data/backups on the data volume; download it, then delete it:
#   GET /api/v1/backups/<id>/archive, DELETE /api/v1/backups/<id>/archive. Or stream one: GET /api/v1/backups/stream.
# /data/backups is where archives are taken from, not where they are kept: take them off the cluster.
backup:
  # Backup:Keep: archives kept in /data/backups (1-100); after a backup succeeds, older ones are deleted. The data
  # volume needs room for the data plus one archive as large (uncompressed, the worst case) while a backup runs.
  keep: 1
  # Backup:Compression: zstd (.tar.zst) or none (.tar).
  compression: zstd
  # Backup:CompressionLevel: Zstandard level 1-19.
  compressionLevel: 3
  # Backup:MinFreeBytes: a backup refuses to start with less free space on the data volume (blobs released while it
  # runs stay until it ends). 0 turns the check off.
  minFreeBytes: 1073741824

# Blobs released by overwrites and deletes (docs/research/blob-retention.md).
blobs:
  # Blobs:RetainDeletedDays: days a released blob stays on the data volume before it is deleted (0-3650), so an older
  # metadata backup can still be restored. Set it to how long metadata backups are kept plus a margin (30 -> 35).
  # Everything overwritten or deleted stays this long: size the volume for it (metrics: retainedBytes). 0: 60 seconds.
  retainDeletedDays: 0

# Restore a backup into the data volume when the volume is empty, before the server starts (an init container running
# `restore --if-empty`). A volume that holds data is never touched, so this is safe to leave set; remove it once the
# server runs on the restored data. Chart README, "Restore a backup".
restore:
  # The archive: an http(s) URL read as it downloads (a presigned S3 or R2 URL, any web server), or a file path the
  # init container can read. Not /data/backups: a restore fills an empty data volume, where that folder is gone. A
  # presigned URL is a credential: keep it out of Git (TimeOps stores Values encrypted) and let it expire.
  archive: ""

# More environment variables, e.g. { name: TimeStore__Multipart__AbandonAfterDays, value: "3" }.
extraEnv: []

persistence:
  # Keep this on: without a volume, every restart loses all data.
  enabled: true
  # Empty: the cluster's default class (local-path on k3s). Use local or block storage, never NFS or SMB: SQLite
  # needs a local file system for its locks and fsync.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  annotations: {}
  # Use an existing PersistentVolumeClaim instead of the StatefulSet's own.
  existingClaim: ""

service:
  s3:
    type: ClusterIP
    port: 9000
    # Only with type NodePort or LoadBalancer.
    nodePort: null
    annotations: {}
  admin:
    # Keep ClusterIP: reach the admin UI through ingress.admin (with TLS) or kubectl port-forward.
    type: ClusterIP
    port: 9001
    annotations: {}

ingress:
  s3:
    enabled: false
    className: ""
    # Large uploads: lift the proxy's body limit, e.g. for ingress-nginx:
    #   nginx.ingress.kubernetes.io/proxy-body-size: "0"
    #   nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Traefik (the k3s default) has no body limit by default.
    annotations: {}
    host: s3.example.com
    # Secret with the certificate; empty: plain HTTP.
    tlsSecret: ""
  admin:
    enabled: false
    className: ""
    annotations: {}
    host: storage.example.com
    tlsSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

startupProbe:
  httpGet:
    path: /health/live
    port: s3
  periodSeconds: 2
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /health/live
    port: s3
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health/live
    port: s3
  periodSeconds: 5
  failureThreshold: 2

# Time for in-flight requests and the last group commit before the pod stops.
terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# `helm test`: creates a bucket, writes, reads and deletes an object through the S3 service.
tests:
  image: amazon/aws-cli:2.17.0
