# Restores a backup archive, read from an http(s) URL as it downloads (a presigned S3 or R2 URL, any web server), into
# an empty data claim (chart README, "Restore a backup"). Without a running release; with one, restore.archive is simpler.
# Run it while no TimeStore pod uses the data claim. Change the three marked values, then:
#   kubectl -n <namespace> apply -f restore-job.yaml
#   until kubectl -n <namespace> get job timestore-restore -o jsonpath='{.status.conditions[*].type}' \
#     | grep -qwE 'Complete|Failed'; do sleep 5; done        # (kubectl wait cannot wait for one of two conditions)
#   kubectl -n <namespace> logs job/timestore-restore        # "all checksums verified", or why it refused
#   kubectl -n <namespace> get job timestore-restore         # STATUS Complete: restored; Failed: refused
#   kubectl -n <namespace> delete job timestore-restore
apiVersion: batch/v1
kind: Job
metadata:
  name: timestore-restore
spec:
  backoffLimit: 0 # a refused restore (damaged archive, non-empty claim) fails the same way on every try
  template:
    spec:
      restartPolicy: Never
      securityContext: # as the chart's pod: the restored files belong to the user TimeStore runs as
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: ghcr.io/tainguyen1501/timestore:0.1.0 # CHANGE: the release's version, or newer
          args:
            - restore
            - --archive
            - https://example.r2.cloudflarestorage.com/backups/timestore-node-1-20261118T020000Z.tar.zst # CHANGE: the archive's URL
            - --data-path
            - /data
          env:
            - name: DOTNET_EnableDiagnostics
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-ts-timestore-0 # CHANGE: data-<release>-timestore-0, created empty (data-claim.yaml)
        - name: tmp
          emptyDir: {}
